version: '3.8'

services:
  mongo-ciudadano:
    image: mongo:7.0
    container_name: bomberos-mongo-ciudadano
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bomberos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms4-ciudadano-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bomberos-ms4-ciudadano
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - APP_NAME=MS-04 Portal Ciudadano
      - APP_ENV=production
      - PORT=8083
      - MONGO_URI=mongodb://mongo-ciudadano:27017
      - MONGO_DB=bomberos_ciudadano
      - IA_CORE_URL=http://ms5_ia_mcp_backend:8005
      - COMANDOS_MS1_URL=https://bomberos-uagrm-scz.duckdns.org
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-bomberos-scz-evidencias}
      - LOCAL_STORAGE_BASE_URL=http://localhost:8083
    volumes:
      - ./storage/evidencias:/app/storage/evidencias
    depends_on:
      mongo-ciudadano:
        condition: service_healthy
    networks:
      - bomberos-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local

networks:
  bomberos-network:
    driver: bridge
